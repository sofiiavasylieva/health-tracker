<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <div class="brand">
        <div class="brand-icon" style="background:rgba(255,255,255,0.15);">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21s-8-4.9-8-10.5A5.5 5.5 0 0 1 12 6.1a5.5 5.5 0 0 1 8 4.4C20 16.1 12 21 12 21z" fill="white" fill-opacity="0.9"/>
                <path d="M7 12.5h2.5l1.5-3 2 6 1.5-3.5.5.5H18" stroke="#1e40af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div>
            Health Tracker
            <span class="brand-sub">Your Health Companion</span>
        </div>
    </div>

    <div class="nav-section">Головне</div>
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if page=='dashboard' %}active{% endif %}">
        <i class="fas fa-chart-area"></i> Dashboard
    </a>
    <a href="{{ url_for('tracker') }}" class="nav-link {% if page=='tracker' %}active{% endif %}">
        <i class="fas fa-plus-circle"></i> Add Entry
    </a>
    <a href="{{ url_for('ai_agent') }}" class="nav-link {% if page=='ai_agent' %}active{% endif %}">
        <i class="fas fa-robot"></i> AI Assistant
    </a>

    {% if user and user|length > 11 and user[11] == 1 %}
    <div class="nav-section">Дослідження</div>
    <a href="{{ url_for('research') }}" class="nav-link {% if page=='research' %}active{% endif %}">
        <i class="fas fa-flask"></i> Аналіз підходів
    </a>
    {% endif %}

    <div class="sidebar-bottom">
        <a href="{{ url_for('profile') }}" class="nav-link {% if page=='profile' %}active{% endif %}">
            <i class="fas fa-user-circle"></i> Профіль
        </a>
        <a href="{{ url_for('logout') }}" class="nav-link logout">
            <i class="fas fa-sign-out-alt"></i> Вийти
        </a>
        {% if user %}
        <div class="user-chip">
            <div class="user-avatar">{{ user[1][0].upper() }}</div>
            <div>
                <div class="user-name">{{ user[1] }}</div>
                <div class="user-email">{{ user[2] }}</div>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>
</body>
</html>
