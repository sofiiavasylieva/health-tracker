<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
    <div class="brand">
        <div class="brand-icon">❤️</div>
        Health Tracker
    </div>

    <div class="nav-section">Навігація</div>

    <a href="{{ url_for('dashboard') }}" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
        <i class="fas fa-chart-area"></i> Дашборд
    </a>
    <a href="{{ url_for('tracker') }}" class="nav-link {% if page == 'tracker' %}active{% endif %}">
        <i class="fas fa-plus-circle"></i> Трекер
    </a>
    <a href="{{ url_for('ai_agent') }}" class="nav-link {% if page == 'ai_agent' %}active{% endif %}">
        <i class="fas fa-robot"></i> AI Асистент
    </a>

    <div class="nav-section" style="margin-top: 16px;">Дослідження</div>
    <a href="{{ url_for('research') }}" class="nav-link {% if page == 'research' %}active{% endif %}">
        <i class="fas fa-flask"></i> Аналіз підходів
    </a>

    <div class="sidebar-bottom">
        <a href="{{ url_for('profile') }}" class="nav-link {% if page == 'profile' %}active{% endif %}" style="margin-bottom: 8px;">
            <i class="fas fa-user-circle"></i> Профіль
        </a>
        <a href="{{ url_for('logout') }}" class="nav-link logout">
            <i class="fas fa-sign-out-alt"></i> Вийти
        </a>
        {% if user %}
        <div class="user-chip" style="margin-top: 12px;">
            <div class="user-avatar">{{ user[1][0].upper() }}</div>
            <div>
                <div class="user-name">{{ user[1] }}</div>
                <div class="user-role">{{ user[5] if user[5] else 'Користувач' }}</div>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>
</body>
</html>
