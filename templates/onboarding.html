<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування — Health Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="onboarding-layout">

<div class="onboarding-card">

    <!-- Step indicator -->
    <div class="ob-step-indicator">
        <div class="ob-step {% if step >= 1 %}active{% endif %} {% if step > 1 %}done{% endif %}"></div>
        <div class="ob-step {% if step >= 2 %}active{% endif %} {% if step > 2 %}done{% endif %}"></div>
        <div class="ob-step {% if step >= 3 %}active{% endif %}"></div>
    </div>

    {% if step == 1 %}
    <!-- STEP 1: Gender & Age -->
    <div class="ob-title">Розкажи про себе</div>
    <div class="ob-subtitle">Крок 1 з 3 — базова інформація</div>

    <form method="POST" action="/onboarding">
        <input type="hidden" name="step" value="1">

        <div class="form-group">
            <div class="form-label">Стать</div>
            <div class="gender-grid">
                <label class="gender-card" id="card-male" onclick="selectGender('male', this)">
                    <input type="radio" name="gender" value="male" required>
                    <div class="gender-icon">♂️</div>
                    <div class="gender-label">Чоловік</div>
                </label>
                <label class="gender-card" id="card-female" onclick="selectGender('female', this)">
                    <input type="radio" name="gender" value="female" required>
                    <div class="gender-icon">♀️</div>
                    <div class="gender-label">Жінка</div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Вік</label>
            <input type="number" name="age" class="form-control" placeholder="25" min="10" max="120" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
            Далі <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    {% elif step == 2 %}
    <!-- STEP 2: Height & Weight -->
    <div class="ob-title">Твої параметри</div>
    <div class="ob-subtitle">Крок 2 з 3 — антропометрія</div>

    <form method="POST" action="/onboarding">
        <input type="hidden" name="step" value="2">

        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Зріст (см)</label>
                <input type="number" name="height" class="form-control" placeholder="175" min="100" max="250" required>
            </div>
            <div class="form-group">
                <label class="form-label">Вага (кг)</label>
                <input type="number" name="weight" class="form-control" placeholder="70" step="0.1" min="30" max="300" required>
            </div>
        </div>

        <div class="flex gap-12 mt-8">
            <a href="/onboarding" class="btn btn-secondary btn-full">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
            <button type="submit" class="btn btn-primary btn-full">
                Далі <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </form>

    {% elif step == 3 %}
    <!-- STEP 3: Goal & Activity -->
    <div class="ob-title">Твоя ціль</div>
    <div class="ob-subtitle">Крок 3 з 3 — майже готово!</div>

    <form method="POST" action="/onboarding">
        <input type="hidden" name="step" value="3">

        <div class="form-group">
            <div class="form-label">Ціль</div>
            <div class="goal-grid">
                <label class="goal-card" onclick="selectGoal('lose', this)">
                    <input type="radio" name="goal" value="lose" required>
                    <div class="goal-icon">📉</div>
                    <div class="goal-text">Схуднути</div>
                </label>
                <label class="goal-card" onclick="selectGoal('maintain', this)">
                    <input type="radio" name="goal" value="maintain">
                    <div class="goal-icon">⚖️</div>
                    <div class="goal-text">Підтримати вагу</div>
                </label>
                <label class="goal-card" onclick="selectGoal('gain', this)">
                    <input type="radio" name="goal" value="gain">
                    <div class="goal-icon">💪</div>
                    <div class="goal-text">Набрати масу</div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Рівень активності</label>
            <select name="activity_level" class="form-control" required>
                <option value="1.2">Мінімальна (сидяча робота)</option>
                <option value="1.375">Легка (1–3 тренування/тиждень)</option>
                <option value="1.55" selected>Помірна (3–5 тренувань/тиждень)</option>
                <option value="1.725">Висока (6–7 тренувань/тиждень)</option>
                <option value="1.9">Дуже висока (фізична робота + спорт)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-check"></i> Почати!
        </button>
    </form>
    {% endif %}

</div>

<script>
function selectGender(val, el) {
    document.querySelectorAll('.gender-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
}
function selectGoal(val, el) {
    document.querySelectorAll('.goal-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
}
</script>
</body>
</html>
