<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Health Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-layout">

<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon" style="width:32px;height:32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;">❤️</div>
        Health Tracker
    </div>

    <div class="auth-title">Створи акаунт</div>
    <div class="auth-sub">Почни стежити за своїм здоров'ям вже сьогодні</div>

    {% with messages = get_flashed_messages(with_categories=True) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}" style="margin-bottom: 16px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/register">
        <div class="form-group">
            <label class="form-label">Ім'я користувача</label>
            <input type="text" name="username" class="form-control" placeholder="Твоє ім'я" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" placeholder="Мінімум 8 символів" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 8px;">
            Зареєструватись <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <div class="auth-footer">
        Вже є акаунт? <a href="{{ url_for('login') }}">Увійти</a>
    </div>
</div>

</body>
</html>
