{% extends "base.html" %}
{% block content %}

<div style="display:flex;flex-direction:column;height:calc(100vh - 80px);max-width:860px;margin:0 auto;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0;">
        <div>
            <div class="page-title">AI Асистент</div>
            <div class="page-subtitle">Персональний помічник на основі твоїх показників</div>
        </div>
        <div style="display:flex;align-items:center;gap:7px;background:var(--green-light);color:var(--green);padding:7px 16px;border-radius:100px;font-size:0.8rem;font-weight:600;border:1px solid rgba(16,185,129,0.2);">
            <span style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite;"></span>
            Groq · llama-3.3-70b
        </div>
    </div>

    <!-- Chat container -->
    <div style="flex:1;background:white;border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.07);display:flex;flex-direction:column;overflow:hidden;min-height:0;">

        <!-- Messages -->
        <div id="chatBody" style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;gap:10px;align-items:flex-start;">
                <div style="width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--violet));border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.9rem;">🤖</div>
                <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:12px 16px;max-width:75%;font-size:0.9rem;color:var(--text-2);line-height:1.6;">
                    Привіт, <strong>{{ user[1] if user else '' }}</strong>! 👋<br>
                    Я твій health-асистент. Запитай про здоров'я або обери підказку нижче.
                </div>
            </div>
        </div>

        <!-- Suggestions -->
        <div id="suggestions" style="padding:12px 20px;border-top:1px solid var(--border-2);background:var(--surface-2);display:flex;flex-wrap:wrap;gap:7px;">
            <button class="suggestion-chip" onclick="sendSuggestion(this)">📊 Як мої показники?</button>
            <button class="suggestion-chip" onclick="sendSuggestion(this)">💤 Норма сну?</button>
            <button class="suggestion-chip" onclick="sendSuggestion(this)">🏃 Скільки тренуватись?</button>
            <button class="suggestion-chip" onclick="sendSuggestion(this)">💧 Норма води?</button>
            <button class="suggestion-chip" onclick="sendSuggestion(this)">❤️ Що таке пульс у спокої?</button>
            <button class="suggestion-chip" onclick="sendSuggestion(this)">⚖️ Як знизити вагу?</button>
        </div>

        <!-- Input -->
        <div style="padding:16px 20px;border-top:1px solid var(--border);background:white;display:flex;gap:10px;align-items:center;">
            <input type="text" id="chatInput"
                   placeholder="Напиши запитання про здоров'я..."
                   style="flex:1;padding:12px 16px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;transition:all 0.14s;"
                   onfocus="this.style.borderColor='var(--blue)';this.style.background='white'"
                   onblur="this.style.borderColor='var(--border)';this.style.background='var(--surface-2)'"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();sendMessage();}">
            <button onclick="sendMessage()" id="sendBtn"
                    style="width:46px;height:46px;background:var(--blue);border:none;border-radius:12px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.15s;box-shadow:0 2px 8px rgba(37,99,235,0.3);flex-shrink:0;"
                    onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='var(--blue)'">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.msg-user {
    display:flex; justify-content:flex-end;
}
.msg-user-bubble {
    background:var(--blue); color:white;
    border-radius:16px 4px 16px 16px;
    padding:11px 16px; max-width:75%;
    font-size:0.9rem; line-height:1.6;
    box-shadow:0 2px 8px rgba(37,99,235,0.25);
}
.msg-ai { display:flex; gap:10px; align-items:flex-start; }
.msg-ai-avatar {
    width:36px; height:36px; flex-shrink:0;
    background:linear-gradient(135deg,var(--blue),var(--violet));
    border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:0.9rem;
}
.msg-ai-bubble {
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:4px 16px 16px 16px;
    padding:12px 16px; max-width:75%;
    font-size:0.9rem; color:var(--text-2); line-height:1.6;
}
</style>

<script>
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await send(text);
}
function sendSuggestion(btn) {
    send(btn.textContent.trim());
}
function appendUser(text) {
    const body = document.getElementById('chatBody');
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML = `<div class="msg-user-bubble">${text}</div>`;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
}
function appendAI(html, isTyping) {
    const body = document.getElementById('chatBody');
    const div = document.createElement('div');
    div.className = 'msg-ai';
    div.innerHTML = `<div class="msg-ai-avatar">🤖</div><div class="msg-ai-bubble">${html}</div>`;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div;
}
async function send(text) {
    appendUser(text);
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const typing = appendAI('<span style="opacity:0.4;font-size:0.85rem;"><i class="fas fa-circle-notch fa-spin"></i> Думаю...</span>');
    try {
        const res = await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({message: text})
        });
        const data = await res.json();
        typing.querySelector('.msg-ai-bubble').innerHTML = (data.reply || 'Вибач, помилка.').replace(/\n/g,'<br>');
    } catch {
        typing.querySelector('.msg-ai-bubble').innerHTML = '⚠️ Помилка зв\'язку.';
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
    document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
}
</script>
{% endblock %}
